kind = "web"
previewPath = "/"
title = "Value Driven AI Operating System"
version = "1.0.0"
id = "artifacts/vda-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23756

[services.development]
run = "pnpm --filter @workspace/vda-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vda-os", "run", "build" ]
publicDir = "artifacts/vda-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23756"
BASE_PATH = "/"
